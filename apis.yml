name: Omen
description: 'Omen (omen.ai) delivers real-time asset intelligence through continuous fluid analysis,
  monitoring the health of mission-critical machinery in data centers and heavy industry. Its two
  offerings are a non-invasive permanent sensor that attaches to equipment for continuous, automated
  fluid (oil, coolant, water) analysis and real-time health tracking, and a portable canister lab that
  performs on-site, off-site, and field spectroscopic testing. The platform detects wear, contamination,
  and degradation before failures occur, targeting the machines the world depends on. Backed by CRV.
  As of this enrichment pass Omen publishes no public API, developer portal, documentation, or SDKs;
  this profile captures company identity only.'
